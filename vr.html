<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Сонячна система - VR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="sun-tex" src="sun.jpg">
        <img id="mercury-tex" src="mercury.jpg">
        <img id="venus-tex" src="venus.jpg">
        <img id="earth-tex" src="holy_terra.jpg">
        <img id="mars-tex" src="mars.jpg">
        <img id="jupiter-tex" src="jupiter.jpg">
        <img id="saturn-tex" src="saturn.jpg">
        <img id="uranus-tex" src="uranus.jpg">
        <img id="neptune-tex" src="neptune.jpg">
        <img id="space-tex" src="space.jpg">
      </a-assets>

      <a-sky src="#space-tex" color="#111"></a-sky>

      <a-entity position="0 1.5 -15">
        <a-sphere src="#sun-tex" radius="2" animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"></a-sphere>

        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
          <a-sphere src="#mercury-tex" radius="0.2" position="3 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 2000"></a-sphere>
        </a-entity>
        
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 7000">
          <a-sphere src="#venus-tex" radius="0.4" position="4.5 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-sphere>
        </a-entity>
        
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">
          <a-sphere src="#earth-tex" radius="0.5" position="6 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-sphere>
        </a-entity>
        
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 15000">
          <a-sphere src="#mars-tex" radius="0.3" position="7.5 0 0"></a-sphere>
        </a-entity>
        
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 30000">
          <a-sphere src="#jupiter-tex" radius="1.2" position="11 0 0"></a-sphere>
        </a-entity>
        
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 45000">
          <a-sphere src="#saturn-tex" radius="0.9" position="15 0 0">
            <a-ring color="#A69074" radius-inner="1.2" radius-outer="2" rotation="-70 0 0"></a-ring>
          </a-sphere>
        </a-entity>
        
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 60000">
          <a-sphere src="#uranus-tex" radius="0.6" position="18 0 0"></a-sphere>
        </a-entity>
        
        <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 80000">
          <a-sphere src="#neptune-tex" radius="0.6" position="21 0 0"></a-sphere>
        </a-entity>
      </a-entity>
      
      <a-camera position="0 2 0"></a-camera>
    </a-scene>
  </body>
</html>
